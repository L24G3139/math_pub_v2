<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>a・p・q シミュレーター</title>
<style>
:root{--bg:#F7F4EC;--card:#FFFDF8;--line:#D8D3C4;--ink:#172033;--sub:#4F5A6B;--a:#A8430A;--p:#1B559A;--q:#6E3490}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
#wrap{height:100%;display:flex;flex-direction:column;gap:10px;padding:44px 12px 12px}
#eq{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 16px;font-size:28px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden}
#eq .a{color:var(--a)}#eq .p{color:var(--p)}#eq .q{color:var(--q)}
#ctl{display:flex;gap:10px;flex-wrap:wrap}
.sl{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 14px}
.sl b{font-size:30px;font-style:italic;width:26px;text-align:center}
.sl output{font-size:22px;font-weight:700;width:52px;text-align:right;font-variant-numeric:tabular-nums}
.sl input{flex:1;min-width:80px;height:28px}
.sl.a b,.sl.a output{color:var(--a)}.sl.p b,.sl.p output{color:var(--p)}.sl.q b,.sl.q output{color:var(--q)}
.sl.a input{accent-color:var(--a)}.sl.p input{accent-color:var(--p)}.sl.q input{accent-color:var(--q)}
.sl.off{opacity:.45}
.sl .fix{font-size:14px;color:var(--sub);width:34px}
#who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px;font-weight:700}
.wb{font:inherit;font-size:22px;font-style:italic;font-weight:800;width:48px;height:40px;border-radius:12px;border:3px solid var(--line);background:var(--card);cursor:pointer}
.wb.a{color:var(--a)}.wb.p{color:var(--p)}.wb.q{color:var(--q)}
.wb.sel.a{background:#FBE6D6;border-color:var(--a)}.wb.sel.p{background:#DDE9F8;border-color:var(--p)}.wb.sel.q{background:#EADCF3;border-color:var(--q)}
#hint{font-size:15px;font-weight:400;color:var(--sub)}
#cv{flex:1;min-height:240px;width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;display:block}
</style>
</head>
<body>
<div id="wrap">
  <div id="eq"></div>
  <div id="ctl"></div>
  <canvas id="cv"></canvas>
</div>

<script>
/* ===== 設定（.env から build.py が書き込む。直接は書きかえない） ===== */
var CONFIG = {
  api: "https://script.google.com/a/macros/chibatech.ac.jp/s/AKfycbyzsdUrBlJ0qKVd7q4mxGRZHw6k_jhklN7H6zrzxD8oVVzMG_jzqjZFlEb1Lsc5OYCnqw/exec",
  room: "main",          // クラス名。?room=1組 のようにURLで上書きできる
  hash: "a:347213dd2b6e78d0efaa5933376dbbac13b0327664211d50b72956759aa0f1ce,p:dc4aa707636ec734bb22a822b62592c85c668c511f10e98da810420c8d5d2181,q:4b9fd282c24e4da0edeafb9d4e0b197af29400f86f53de0204e09d6d0037799f", // 担当ごとのパスワードのSHA-256（.env から作る）
  pwMinutes: 4           // パスワードで開いたとき、何分で閉じるか
};
/* ===================================== */

var Q = new URLSearchParams(location.search);
var ROLE = Q.get("role");                 // a / p / q … 担当をあらかじめ決めておくとき（なくてよい）
if (ROLE !== "a" && ROLE !== "p" && ROLE !== "q") ROLE = "";
var ROOM = Q.get("room") || CONFIG.room;

// ロック（unlock.js）を読み込む。段階1（担当の変数だけ）から開く。担当は、生徒が画面で選ぶ
(function () {
  var s = document.createElement("script");
  s.src = "unlock.js?v=20261022233418";   // 古い unlock.js がキャッシュに残らないように、作った日時をつける
  s.setAttribute("data-api", CONFIG.api);
  s.setAttribute("data-room", ROOM);
  s.setAttribute("data-min-stage", "1");
  s.setAttribute("data-pw-minutes", String(CONFIG.pwMinutes));
  s.setAttribute("data-hash", CONFIG.hash);
  document.body.appendChild(s);
})();

// unlock.js が古い・読めないときは、画面の下に知らせる（このとき、担当を選んでも動かない）
setTimeout(function () {
  if (typeof window.simStage !== "undefined") return;
  var m = document.createElement("div");
  m.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#A8430A;color:#fff;padding:10px 16px;font-size:16px;font-weight:700;text-align:center";
  m.textContent = "unlock.js が古いか、読みこめていません。simulator.html と同じ場所に、新しい unlock.js を置いてください。";
  document.body.appendChild(m);
}, 6000);

var st = { a: 1, p: 0, q: 0 };
var NAMES = ["a", "p", "q"];
var RMAX = 5;                              // a, p, q の動かせる範囲（−RMAX 〜 RMAX）
var ctl = document.getElementById("ctl"), eq = document.getElementById("eq");
var cv = document.getElementById("cv"), c = cv.getContext("2d");
var role = ROLE;
try { if (!role) role = sessionStorage.getItem("simRole-" + ROOM) || ""; } catch (e) {}
var rows = {}, inputs = {}, outs = {}, fixes = {}, whoBtns = {};

// 担当の選択
var who = document.createElement("div");
who.id = "who";
var whoLab = document.createElement("span");
whoLab.textContent = "あなたの担当は？";
who.appendChild(whoLab);
NAMES.forEach(function (k) {
  var b = document.createElement("button");
  b.type = "button"; b.className = "wb " + k; b.textContent = k;
  b.onclick = function () { chooseRole(k); };
  whoBtns[k] = b; who.appendChild(b);
});
var hint = document.createElement("span");
hint.id = "hint";
who.appendChild(hint);
ctl.parentNode.insertBefore(who, ctl);

NAMES.forEach(function (k) {
  var d = document.createElement("div");
  d.className = "sl " + k + " off";
  var b = document.createElement("b"); b.textContent = k;
  var r = document.createElement("input");
  r.type = "range"; r.min = -RMAX; r.max = RMAX; r.step = 0.5; r.value = st[k]; r.disabled = true;
  r.setAttribute("aria-label", k);
  var o = document.createElement("output");
  var f = document.createElement("span"); f.className = "fix"; f.textContent = "固定";
  d.appendChild(b); d.appendChild(r); d.appendChild(o); d.appendChild(f);
  ctl.appendChild(d);
  rows[k] = d; inputs[k] = r; outs[k] = o; fixes[k] = f;
  r.oninput = function () { st[k] = parseFloat(r.value); o.textContent = fmt(st[k]); draw(); };
  o.textContent = fmt(st[k]);
});

function chooseRole(k) {
  role = k;
  try { sessionStorage.setItem("simRole-" + ROOM, k); } catch (e) {}
  st = { a: 1, p: 0, q: 0 };                 // 担当を変えたら、もとの値にもどす
  NAMES.forEach(function (n) { inputs[n].value = st[n]; outs[n].textContent = fmt(st[n]); });
  applyStage();
  draw();
}

// いまの段階（0=ロック／1=担当の変数だけ／2=すべて）に合わせて、動かせるスライダーを決める
function applyStage() {
  var s = window.simStage || 0;
  var byPw = window.simBy === "password" && window.simPwRole;
  if (byPw) role = window.simPwRole;         // パスワードで開いたときは、そのパスワードの担当に決まる
  NAMES.forEach(function (k) {
    var on = s >= 2 || (s === 1 && role === k);
    inputs[k].disabled = !on;
    rows[k].className = "sl " + k + (on ? "" : " off");
    fixes[k].style.display = on ? "none" : "inline";
    whoBtns[k].className = "wb " + k + (role === k ? " sel" : "");
  });
  who.style.display = s >= 2 ? "none" : "flex";
  whoLab.style.display = byPw ? "none" : "";
  NAMES.forEach(function (k) { whoBtns[k].style.display = byPw ? "none" : ""; });
  hint.textContent = s === 1 ? (byPw ? "パスワードの担当（" + role + "）だけ動かせます" : role ? "選んだ変数だけ動かせます" : "担当を選ぶと、その変数が動かせます") : "";
}
window.addEventListener("simulator:unlock", applyStage);
window.addEventListener("simulator:stage", applyStage);
window.addEventListener("simulator:lock", applyStage);

function fmt(v) { return (v < 0 ? "−" : "") + String(Math.abs(v)); }

function eqText() {
  var a = st.a, p = st.p, q = st.q;
  eq.innerHTML = "";
  function sp(cls, t) { var s = document.createElement("span"); if (cls) s.className = cls; s.textContent = t; eq.appendChild(s); }
  sp("", "y = ");
  sp("a", fmt(a));
  sp("", "(x ");
  sp("p", (p >= 0 ? "− " : "+ ") + Math.abs(p));
  sp("", ")² ");
  sp("q", (q >= 0 ? "+ " : "− ") + Math.abs(q));
}

var XMIN = -10, XMAX = 10, YMIN = -10, YMAX = 30;
function draw() {
  eqText();
  var dpr = window.devicePixelRatio || 1;
  var W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  var ML = 30, MB = 24, MT = 8, MR = 12;
  var gx = function (x) { return ML + (x - XMIN) / (XMAX - XMIN) * (W - ML - MR); };
  var gy = function (y) { return MT + (YMAX - y) / (YMAX - YMIN) * (H - MT - MB); };
  var i, x, y;
  // 細かい方眼
  c.lineWidth = 1; c.strokeStyle = "#ECE8DA"; c.beginPath();
  for (x = XMIN; x <= XMAX; x++) { c.moveTo(gx(x), gy(YMAX)); c.lineTo(gx(x), gy(YMIN)); }
  for (y = YMIN; y <= YMAX; y++) { c.moveTo(gx(XMIN), gy(y)); c.lineTo(gx(XMAX), gy(y)); }
  c.stroke();
  // 5ごとの太い線
  c.strokeStyle = "#D8D3C4"; c.beginPath();
  for (y = -10; y <= YMAX; y += 5) { c.moveTo(gx(XMIN), gy(y)); c.lineTo(gx(XMAX), gy(y)); }
  c.stroke();
  // 軸
  c.strokeStyle = "#172033"; c.lineWidth = 1.8; c.beginPath();
  c.moveTo(gx(0), gy(YMAX)); c.lineTo(gx(0), gy(YMIN));
  c.moveTo(gx(XMIN), gy(0)); c.lineTo(gx(XMAX), gy(0)); c.stroke();
  // 目盛りの数字
  c.fillStyle = "#4F5A6B"; c.font = "13px sans-serif"; c.textAlign = "center"; c.textBaseline = "top";
  var xs = W < 560 ? 2 : 1;
  for (x = -9; x <= 9; x += xs) { if (x !== 0) c.fillText(String(x).replace("-", "−"), gx(x), Math.min(gy(0) + 4, H - MB + 4)); }
  c.textAlign = "right"; c.textBaseline = "middle";
  for (y = -10; y <= 30; y += 5) { if (y !== 0) c.fillText(String(y).replace("-", "−"), gx(0) - 5, gy(y)); }
  c.fillText("O", gx(0) - 5, gy(0) + 10);
  // 基準 y = x² （点線）
  c.save(); c.beginPath(); c.rect(ML, MT, W - ML - MR, H - MT - MB); c.clip();
  c.setLineDash([7, 6]); c.strokeStyle = "#8B93A0"; c.lineWidth = 2; c.beginPath();
  for (i = 0; i <= 280; i++) { x = XMIN + i * (XMAX - XMIN) / 280; if (i === 0) c.moveTo(gx(x), gy(x * x)); else c.lineTo(gx(x), gy(x * x)); }
  c.stroke(); c.setLineDash([]);
  // 動かす曲線
  c.strokeStyle = "#1B4FD8"; c.lineWidth = 3; c.lineJoin = "round"; c.beginPath();
  for (i = 0; i <= 280; i++) { x = XMIN + i * (XMAX - XMIN) / 280; y = st.a * (x - st.p) * (x - st.p) + st.q; if (i === 0) c.moveTo(gx(x), gy(y)); else c.lineTo(gx(x), gy(y)); }
  c.stroke();
  // 整数の x の点
  c.fillStyle = "#F28C28"; c.strokeStyle = "#172033"; c.lineWidth = 1.5;
  for (x = -3; x <= 3; x++) { y = st.a * (x - st.p) * (x - st.p) + st.q; c.beginPath(); c.arc(gx(x), gy(y), 6, 0, 6.2832); c.fill(); c.stroke(); }
  // 頂点 V
  c.fillStyle = "#D62828"; c.beginPath(); c.arc(gx(st.p), gy(st.q), 7, 0, 6.2832); c.fill(); c.stroke();
  c.restore();
  c.fillStyle = "#D62828"; c.font = "italic 20px serif"; c.textAlign = "left"; c.textBaseline = "bottom";
  c.fillText("V", gx(st.p) + 10, gy(st.q) - 6);
}
window.addEventListener("resize", draw);
applyStage();
draw();
</script>
</body>
</html>
